<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>클래식 스네이크 게임</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
        #score-board {
            font-size: 18px; font-weight: bold; margin-bottom: 15px;
            background: #1e293b; padding: 8px 20px; border-radius: 20px; border: 1px solid #334155;
        }
        #game-container { position: relative; }
        canvas {
            background-color: #1e293b; border: 3px solid #334155;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: block;
        }
        .controls {
            margin-top: 15px; display: grid; grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px); gap: 10px; justify-content: center;
        }
        .btn {
            background: #334155; color: white; border: none; border-radius: 12px;
            font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { background: #475569; transform: translateY(2px); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 12px; display: none;
        }
        #game-over h2 { font-size: 28px; color: #ef4444; margin-bottom: 10px; }
        #restart-btn {
            margin-top: 15px; padding: 10px 20px; background: #22c55e;
            color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🐍 스네이크 게임</h1>
    <div id="score-board">점수: <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="320"></canvas>
        <div id="game-over">
            <h2>게임 오버!</h2>
            <p style="font-size: 18px;">최종 점수: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="resetGame()">다시 시작</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="btn-up" onclick="changeDir('UP')">▲</button>
        <button class="btn" id="btn-left" onclick="changeDir('LEFT')">◀</button>
        <button class="btn" id="btn-down" onclick="changeDir('DOWN')">▼</button>
        <button class="btn" id="btn-right" onclick="changeDir('RIGHT')">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 16;
        let count = 0;
        let score = 0;

        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
        let apple = { x: 80, y: 80 };

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (++count < 6) return;
            count = 0;

            ctx.clearRect(0,0,canvas.width,canvas.height);
            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
                showGameOver(); return;
            }

            snake.cells.unshift({x: snake.x, y: snake.y});
            if (snake.cells.length > snake.maxCells) snake.cells.pop();

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(apple.x, apple.y, grid-1, grid-1);

            ctx.fillStyle = '#22c55e';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score += 10;
                    document.getElementById("score").innerText = score;
                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) showGameOver();
                }
            });
        }

        let isGameOver = false;
        function showGameOver() {
            if(isGameOver) return;
            isGameOver = true;
            document.getElementById("final-score").innerText = score;
            document.getElementById("game-over").style.display = "flex";
        }

        function resetGame() {
            snake.x = 160; snake.y = 160; snake.cells = []; snake.maxCells = 4;
            snake.dx = grid; snake.dy = 0; score = 0;
            document.getElementById("score").innerText = score;
            document.getElementById("game-over").style.display = "none";
            isGameOver = false;
        }

        function changeDir(dir) {
            if (dir === 'LEFT' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (dir === 'UP' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (dir === 'RIGHT' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (dir === 'DOWN' && snake.dy === 0) { snake.dy = 0; snake.dx = 0; snake.dy = grid; }
        }

        document.addEventListener('keydown', function(e) {
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = 0; snake.dx = 0; snake.dy = grid; }
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
