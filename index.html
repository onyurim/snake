<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realistic Snake Game - Speed Controlled</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 450px;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    .score-board {
      font-size: 16px;
      font-weight: bold;
    }

    /* 난이도 선택 버튼 */
    .speed-selector {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 6px;
    }

    .speed-btn {
      flex: 1;
      padding: 8px 0;
      background: #2a2a2a;
      border: 1px solid #555;
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }

    .speed-btn.active {
      background: #2ECC71;
      color: #000;
      border-color: #27AE60;
    }

    .canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
    }

    canvas {
      background-color: #1e272e;
      border: 3px solid #333;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
    }

    /* 방향 조작 컨트롤러 */
    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 52px);
      gap: 8px;
      padding-bottom: 5px;
    }

    .btn {
      background: #2a2a2a;
      border: 1px solid #555;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px #111;
      touch-action: none;
    }

    .btn:active {
      background: #444;
      box-shadow: 0 2px #111;
      transform: translateY(2px);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div class="game-container">
    <div>
      <div class="header">
        <div class="score-board">점수: <span id="score">0</span></div>
        <div class="score-board">최고: <span id="high-score">0</span></div>
      </div>

      <!-- 난이도 선택 버튼 영역 -->
      <div class="speed-selector">
        <div class="speed-btn active" id="spd-1">1단계 (초급)</div>
        <div class="speed-btn" id="spd-2">2단계 (중급)</div>
        <div class="speed-btn" id="spd-3">3단계 (고급)</div>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="snakeCanvas" width="400" height="400"></canvas>
    </div>

    <!-- 터치 및 마우스 조작 컨트롤러 -->
    <div class="controls">
      <div class="btn btn-up" id="btn-up">▲</div>
      <div class="btn btn-left" id="btn-left">◀</div>
      <div class="btn btn-down" id="btn-down">▼</div>
      <div class="btn btn-right" id="btn-right">▶</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let highScore = 0;
    let gameLoop = null;
    let gameState = 'START';
    let changingDirection = false;
    let tongueTick = 0;

    let currentSpeed = 220;

    function initGame() {
      snake = [
        { x: 10 * gridSize, y: 10 * gridSize },
        { x: 9 * gridSize, y: 10 * gridSize },
        { x: 8 * gridSize, y: 10 * gridSize }
      ];
      dx = gridSize;
      dy = 0;
      score = 0;
      scoreElement.innerText = score;
      spawnFood();
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount) * gridSize;
      food.y = Math.floor(Math.random() * tileCount) * gridSize;

      snake.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) {
          spawnFood();
        }
      });
    }

    function drawFood() {
      const centerX = food.x + gridSize / 2;
      const centerY = food.y + gridSize / 2;
      const radius = gridSize / 2 - 2;

      ctx.fillStyle = '#E74C3C';
      ctx.beginPath();
      ctx.arc(centerX, centerY + 1, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2ECC71';
      ctx.beginPath();
      ctx.ellipse(centerX + 2, centerY - radius + 1, 3, 2, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSnake() {
      tongueTick++;
      const head = snake[0];

      for (let i = snake.length - 1; i >= 1; i--) {
        const seg = snake[i];
        const nextSeg = snake[i - 1];
        const centerX = seg.x + gridSize / 2;
        const centerY = seg.y + gridSize / 2;

        const radius = (gridSize / 2) - (i * 0.3 > 3 ? 3 : i * 0.3);

        ctx.fillStyle = i % 2 === 0 ? '#2ECC71' : '#27AE60';
        ctx.beginPath();
        ctx.arc(centerX, centerY, Math.max(radius, 4), 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = Math.max(radius * 1.8, 8);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(nextSeg.x + gridSize / 2, nextSeg.y + gridSize / 2);
        ctx.stroke();
      }

      const headX = head.x + gridSize / 2;
      const headY = head.y + gridSize / 2;

      ctx.save();
      ctx.translate(headX, headY);

      let angle = 0;
      if (dx === gridSize) angle = 0;
      if (dx === -gridSize) angle = Math.PI;
      if (dy === -gridSize) angle = -Math.PI / 2;
      if (dy === gridSize) angle = Math.PI / 2;
      ctx.rotate(angle);

      if (tongueTick % 4 < 2) {
        ctx.strokeStyle = '#E74C3C';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(17, 0);
        ctx.lineTo(20, -3);
        ctx.moveTo(17, 0);
        ctx.lineTo(20, 3);
        ctx.stroke();
      }

      ctx.fillStyle = '#2ECC71';
      ctx.beginPath();
      ctx.ellipse(0, 0, gridSize / 2 + 2, gridSize / 2 - 1, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(3, -5, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(4, -5, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(3, 5, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(4, 5, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#1e272e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameState === 'START') {
        drawCenterText('스네이크 게임', '터치 또는 방향키로 시작');
        return;
      }

      drawFood();
      drawSnake();

      if (gameState === 'GAMEOVER') {
        drawCenterText('GAME OVER', `점수: ${score} (다시 시작하려면 터치)`);
      }
    }

    function drawCenterText(mainText, subText) {
      ctx.fillStyle = '#FFF';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.textAlign = 'center';

      ctx.font = 'bold 28px Arial';
      ctx.strokeText(mainText, canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillText(mainText, canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = '16px Arial';
      ctx.strokeText(subText, canvas.width / 2, canvas.height / 2 + 30);
      ctx.fillText(subText, canvas.width / 2, canvas.height / 2 + 30);
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      changingDirection = false;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameOver();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreElement.innerText = highScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      clearInterval(gameLoop);
      gameLoop = null;
      draw();
    }

    function startGame() {
      initGame();
      gameState = 'PLAYING';
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(() => {
        update();
        draw();
      }, currentSpeed);
    }

    function changeDirection(dir) {
      if (gameState !== 'PLAYING') {
        startGame();
        return;
      }

      if (changingDirection) return;

      const goingUp = dy === -gridSize;
      const goingDown = dy === gridSize;
      const goingRight = dx === gridSize;
      const goingLeft = dx === -gridSize;

      if (dir === 'LEFT' && !goingRight) { dx = -gridSize; dy = 0; changingDirection = true; }
      if (dir === 'UP' && !goingDown) { dx = 0; dy = -gridSize; changingDirection = true; }
      if (dir === 'RIGHT' && !goingLeft) { dx = gridSize; dy = 0; changingDirection = true; }
      if (dir === 'DOWN' && !goingUp) { dx = 0; dy = gridSize; changingDirection = true; }
    }

    function setSpeed(speed, btnId) {
      currentSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');

      if (gameState === 'PLAYING') {
        clearInterval(gameLoop);
        gameLoop = setInterval(() => {
          update();
          draw();
        }, currentSpeed);
      }
    }

    const bindSpeedBtn = (id, speed) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        setSpeed(speed, id);
      }, { passive: false });
    };

    bindSpeedBtn('spd-1', 220);
    bindSpeedBtn('spd-2', 160);
    bindSpeedBtn('spd-3', 100);

    const bindBtn = (id, dir) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        changeDirection(dir);
      }, { passive: false });
    };

    bindBtn('btn-up', 'UP');
    bindBtn('btn-left', 'LEFT');
    bindBtn('btn-down', 'DOWN');
    bindBtn('btn-right', 'RIGHT');

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (gameState !== 'PLAYING') {
        startGame();
      }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }

      if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeDirection('LEFT');
      if (e.code === 'ArrowUp' || e.code === 'KeyW') changeDirection('UP');
      if (e.code === 'ArrowRight' || e.code === 'KeyD') changeDirection('RIGHT');
      if (e.code === 'ArrowDown' || e.code === 'KeyS') changeDirection('DOWN');
      if (e.code === 'Space' && gameState !== 'PLAYING') startGame();
    });

    draw();
  </script>
</body>
</html>
